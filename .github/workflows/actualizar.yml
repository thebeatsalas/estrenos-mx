name: Actualizar estrenos

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr script de actualización
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python actualizar_estrenos.py

      - name: Publicar cambios (estrenos.json y estrenos.ics)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estrenos.json estrenos.ics
          git diff --quiet --cached || git commit -m "Actualización automática de estrenos"
          git push
